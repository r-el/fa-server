services:
  server:
    build: .
    ports:
      - "12113:12113"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 12113
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET through the deployment environment}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL through the deployment environment}
      SUPABASE_KEY: ${SUPABASE_KEY:?Set SUPABASE_KEY through the deployment environment}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      SPECTER_API_URL: http://api:8000
      SPECTER_NATS_URL: nats://nats:4222
      QDRANT_URL: http://qdrant:6333
      SPECTER_OWNER_ID: ${SPECTER_OWNER_ID:-facealert}
      SPECTER_API_TOKEN_FILE: /run/secrets/specter_api_token
    networks:
      - default
      - specter
    secrets:
      - specter_api_token

networks:
  default:
  specter:
    external: true
    name: ${SPECTER_NETWORK:-specter_default}

secrets:
  specter_api_token:
    # Relative to this Compose file: server/../../.. is the Specter repository root.
    file: ../../../deploy/secrets/api.token
